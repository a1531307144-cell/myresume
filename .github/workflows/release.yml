name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer/main/preload
        run: npm run build

      - name: Build installer & publish to GitHub Releases
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release upload "$tag" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
