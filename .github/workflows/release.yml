name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（测试用）

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 隐私闸门：扫到手机号 / 邮箱 / 密钥 / 内嵌图片 / 本机路径 / 专属敏感词就直接失败。
      # 这一步失败 = 发不出 Release，不依赖人「记得检查」。
      - name: Privacy check
        run: node scripts/privacy-check.mjs

      - name: Build renderer/main/preload
        run: npm run build

      # 先创建草稿 Release，避免 electron-builder 并发上传时竞争创建导致丢文件
      - name: Pre-create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @"
          ## 我的简历 $env:GITHUB_REF_NAME

          简单好用的桌面简历编辑器。

          ### ✨ 本版本新增
          - **模板从 2 套扩到 6 套**（全部为原创设计）：
            法学正式风 · 通用简约风 · **双栏侧边栏**（深色侧栏，技能证书独立成栏）·
            **时间轴**（竖点线串联板块，中英双语标题）· **表格线框**（细线分区，信息密度最高）·
            **顶部色带**（顶部色带 + 大留白单栏）
          - **求职意向更好填**：新建简历自带该字段；导入的简历若原文没有会自动补一行；
            填写位置会显示在简历显眼处（表格表头 / 顶部色带 / 姓名下方）
          - 「关于」里会说明自动检查更新是否因网络失败，不再让人误以为「没有新版」

          ### 🛠 修复
          - 表格线框模板里「求职意向」有标签却填不进去（四套模板对求职意向的处理不一致所致）
          - 文档中的模板标识若失效，会让预览与打印窗口整页崩掉——现会退回默认模板

          ### 📦 完整功能
          - 六套模板一键切换、数据无损
          - AI 参与编写与润色（板块 ✨AI）+ AI 全文诊断
          - 单窗口标签页：一个窗口管理多份简历
          - 板块自由增删/改名/排序（10 种预设）
          - 读取已有简历（Word / 文字版 PDF / TXT 导入）
          - 排版个性化（字体 / 字号 / 行距）
          - 本地文件保存 + 自动保存 + 防丢草稿
          - 矢量文字 PDF 导出（可选中、可搜索、分页不切字）

          ### 📥 安装
          下载下方 **MyResume-Setup-$env:GITHUB_REF_NAME.exe** 双击安装。
          首次安装如遇「Windows 已保护你的电脑」：点 **更多信息 → 仍要运行**（个人开源软件未购买签名证书，属正常现象）。
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --draft --title "我的简历 $env:GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer & upload to draft release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release -Include *.exe, *.blockmap -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 草稿转正式：electron-updater 只认正式 Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
